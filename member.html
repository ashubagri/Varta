<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member Profile — VARTA</title><link rel="stylesheet" href="css/style.css">
<style>
.page-wrap{max-width:820px;margin:auto;padding:36px 15px}.panel,.post{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:18px 0}.member-head{display:flex;gap:16px;align-items:center}.avatar{width:64px;height:64px;border-radius:50%;background:#174b8c;color:white;display:grid;place-items:center;font-size:1.5rem;font-weight:800;flex-shrink:0}.muted{color:#64748b}.bio{white-space:pre-wrap;overflow-wrap:anywhere}.postbody{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.btn{display:inline-block;background:#174b8c;color:#fff;border:1px solid #174b8c;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none}.btn.secondary{background:#fff;color:#174b8c}.btn:disabled{opacity:.6}.main-nav{flex-wrap:wrap}#status{overflow-wrap:anywhere}@media(max-width:600px){.header-wrap{align-items:flex-start;flex-direction:column;padding:14px 0}.member-head{align-items:flex-start}}
</style></head>
<body>
<header class="site-header"><div class="container header-wrap"><a href="index.html" class="brand">VARTA</a><nav class="main-nav"><a href="index.html">Home</a><a href="posts.html">Posts</a><a href="discover.html">Discover</a><a href="activity.html">Activity</a><a href="notifications.html">Notifications</a><a href="profile.html">My Profile</a></nav></div></header>
<main class="page-wrap"><p><a href="discover.html">← Back to Discover</a></p><p id="status" class="muted" role="status" aria-live="polite">Loading member profile…</p><section id="profile" class="panel" hidden></section><h2 id="postsHeading" hidden>Posts by this member</h2><section id="posts"></section></main>
<footer class="site-footer"><div class="container"><p>© 2026 VARTA Prototype</p></div></footer>
<script type="module">
import {supabase} from './js/supabase-client.js';
const $=id=>document.getElementById(id);
const id=new URLSearchParams(location.search).get('id');
const escText=(el,text)=>{el.textContent=text||'';return el;};
if(!id){$('status').textContent='No member was selected. Open Discover and choose a member.';}
else{
 const {data:profile,error}=await supabase.from('profiles').select('id,username,display_name,bio,created_at').eq('id',id).maybeSingle();
 if(error){$('status').textContent='Could not load this profile: '+error.message;}
 else if(!profile){$('status').textContent='This member profile could not be found.';}
 else{
  document.title=(profile.display_name||profile.username||'Member')+' — VARTA';
  const box=$('profile'),head=document.createElement('div');head.className='member-head';
  const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(profile.display_name||profile.username||'V').trim().charAt(0).toUpperCase();
  const details=document.createElement('div');const name=document.createElement('h1');name.textContent=profile.display_name||profile.username||'VARTA Member';
  const handle=document.createElement('p');handle.className='muted';handle.textContent=profile.username?'@'+profile.username:'VARTA member';
  details.append(name,handle);head.append(avatar,details);box.append(head);
  const bio=document.createElement('p');bio.className='bio';bio.textContent=profile.bio||'This member has not added a bio yet.';box.append(bio);
  const actions=document.createElement('div');actions.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-top:18px';
  const back=document.createElement('a');back.href='posts.html';back.className='btn secondary';back.textContent='Community feed';actions.append(back);
  const {data:sessionData}=await supabase.auth.getSession();const user=sessionData.session?.user;
  if(user&&user.id!==profile.id){
   const reportBtn=document.createElement('button');reportBtn.className='btn secondary';reportBtn.type='button';reportBtn.textContent='Report member';
   reportBtn.addEventListener('click',async()=>{
    const choices=['Spam','Harassment or hate','Threats or violence','Misinformation','Sexual content','Privacy violation','Other'];
    const choice=window.prompt('Report reason:\n'+choices.map((x,i)=>(i+1)+'. '+x).join('\n')+'\n\nEnter a number from 1 to 7.');
    if(choice===null)return;
    const index=Number(choice);
    if(!Number.isInteger(index)||index<1||index>choices.length){$('status').textContent='Report cancelled: choose a number from 1 to 7.';return;}
    const detailsText=window.prompt('Optional details (up to 1000 characters). Leave blank if none:')||'';
    reportBtn.disabled=true;
    const {error:reportError}=await supabase.from('content_reports').insert({reporter_id:user.id,target_type:'member',target_id:profile.id,reason:choices[index-1],details:detailsText.trim().slice(0,1000)||null});
    reportBtn.disabled=false;
    $('status').textContent=reportError?'Could not submit report: '+reportError.message:'Thank you. Your report has been submitted for review.';
   });
   actions.append(reportBtn);
   const {data:rel}=await supabase.from('follows').select('follower_id').eq('follower_id',user.id).eq('following_id',profile.id).maybeSingle();
   const btn=document.createElement('button');btn.className='btn';btn.type='button';btn.textContent=rel?'Following · Unfollow':'＋ Follow';
   btn.addEventListener('click',async()=>{btn.disabled=true;const result=rel?await supabase.from('follows').delete().eq('follower_id',user.id).eq('following_id',profile.id):await supabase.from('follows').insert({follower_id:user.id,following_id:profile.id});btn.disabled=false;if(result.error){$('status').textContent='Could not update follow: '+result.error.message;return;}location.reload();});actions.append(btn);
  }
  box.append(actions);box.hidden=false;
  const {data:posts,error:postError}=await supabase.from('posts').select('id,content,created_at').eq('user_id',profile.id).order('created_at',{ascending:false}).limit(50);
  if(postError){$('status').textContent='Profile loaded, but posts could not be loaded: '+postError.message;}
  else{
   $('status').textContent='Member profile loaded.';$('postsHeading').hidden=false;
   if(!posts?.length){const p=document.createElement('p');p.className='muted';p.textContent='This member has not published any posts yet.';$('posts').append(p);}
   for(const post of posts||[]){const card=document.createElement('article');card.className='post';const meta=document.createElement('p');meta.className='muted';meta.textContent=new Date(post.created_at).toLocaleString();const body=document.createElement('p');body.className='postbody';body.textContent=post.content;card.append(meta,body);$('posts').append(card);}
  }
 }
}
</script></body></html>
