<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Member Profile — VARTA</title><link rel="stylesheet" href="css/style.css">
<style>
.page-wrap{max-width:820px;margin:auto;padding:36px 15px}.panel,.post{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:18px 0}.member-head{display:flex;gap:16px;align-items:center}.avatar{width:64px;height:64px;border-radius:50%;background:#174b8c;color:white;display:grid;place-items:center;font-size:1.5rem;font-weight:800;flex-shrink:0}.muted{color:#64748b}.bio{white-space:pre-wrap;overflow-wrap:anywhere}.postbody{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.btn{display:inline-block;background:#174b8c;color:#fff;border:1px solid #174b8c;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none}.btn.secondary{background:#fff;color:#174b8c}.btn:disabled{opacity:.6}.main-nav{flex-wrap:wrap}#status{overflow-wrap:anywhere}@media(max-width:600px){.header-wrap{align-items:flex-start;flex-direction:column;padding:14px 0}.member-head{align-items:flex-start}}
</style></head>
<body>

<div id="varta-language-panel" role="region" aria-label="Choose your language" style="position:relative;z-index:1000;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:8px 16px;background:#f1f5f9;color:#0f172a;font:14px Arial,sans-serif;border-bottom:1px solid #dbe3ec">
  <span aria-hidden="true">🌐</span><strong>Language / भाषा</strong>
  <div id="google_translate_element"></div>
  <noscript>Use your browser's translation feature to read VARTA in your language.</noscript>
</div>
<script>
function googleTranslateElementInit() {
  if (window.google && google.translate && document.getElementById('google_translate_element')) {
    new google.translate.TranslateElement({pageLanguage:'en', includedLanguages:'af,sq,am,ar,hy,az,eu,be,bn,bs,bg,my,ca,zh-CN,zh-TW,hr,cs,da,nl,en,eo,et,tl,fi,fr,gl,ka,de,el,gu,ht,ha,he,hi,hu,is,id,ga,it,ja,jv,kn,kk,km,ko,lo,la,lv,lt,mk,mg,ms,ml,mt,mr,mn,ne,no,ny,ps,fa,pl,pt,pa,ro,ru,sm,gd,sr,st,si,sk,sl,so,es,su,sw,sv,ta,te,th,tr,uk,ur,uz,vi,cy,xh,yi,yo,zu', layout:google.translate.TranslateElement.InlineLayout.SIMPLE, autoDisplay:false}, 'google_translate_element');
  }
}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
<style>
#varta-language-panel .goog-te-gadget{font:14px Arial,sans-serif!important;color:#0f172a!important}
#varta-language-panel .goog-te-gadget-simple{border:1px solid #cbd5e1!important;border-radius:8px!important;padding:7px!important;background:#fff!important}
#varta-language-panel .goog-te-gadget img{display:none!important}
#varta-language-panel .goog-te-gadget span{border:0!important}
@media(max-width:480px){#varta-language-panel{justify-content:center;flex-wrap:wrap;padding:8px}#varta-language-panel strong{font-size:13px}}
</style>

<header class="site-header"><div class="container header-wrap"><a href="index.html" class="brand">VARTA</a><nav class="main-nav"><a href="index.html">Home</a><a href="posts.html">Posts</a><a href="discover.html">Discover</a><a href="activity.html">Activity</a><a href="notifications.html">Notifications</a><a href="profile.html">My Profile</a></nav></div></header>
<main class="page-wrap"><p><a href="discover.html">← Back to Discover</a></p><p id="status" class="muted" role="status" aria-live="polite">Loading member profile…</p><section id="profile" class="panel" hidden></section><h2 id="postsHeading" hidden>Posts by this member</h2><section id="posts"></section></main>
<footer class="site-footer"><div class="container"><p>© 2026 VARTA Prototype</p></div></footer>
<script type="module">
import {supabase} from './js/supabase-client.js';
const $=id=>document.getElementById(id);
const id=new URLSearchParams(location.search).get('id');
const escText=(el,text)=>{el.textContent=text||'';return el;};
const languageNames={en:'English',hi:'Hindi',bn:'Bengali',ta:'Tamil',te:'Telugu',mr:'Marathi',gu:'Gujarati',pa:'Punjabi',ur:'Urdu',kn:'Kannada',ml:'Malayalam',ne:'Nepali',ar:'Arabic',fr:'French',de:'German',es:'Spanish',pt:'Portuguese',ru:'Russian','zh-CN':'Chinese','zh-TW':'Traditional Chinese',ja:'Japanese',ko:'Korean',id:'Indonesian',tr:'Turkish',it:'Italian',fa:'Persian',uk:'Ukrainian',vi:'Vietnamese',sw:'Swahili',el:'Greek'};
async function translateText(text,target){const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+encodeURIComponent(target)+'&dt=t&q='+encodeURIComponent(text);const response=await fetch(url);if(!response.ok)throw new Error('Translation service returned '+response.status);const data=await response.json();return (data[0]||[]).map(part=>part[0]||'').join('')||text;}
function addTranslationControl(container,original,target){const button=document.createElement('button');button.type='button';button.className='btn secondary';button.textContent='Translate to '+(languageNames[target]||target);const translated=document.createElement('p');translated.hidden=true;translated.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f9ff;border-left:3px solid #0284c7;padding:10px 12px;border-radius:6px';button.addEventListener('click',async()=>{if(!translated.hidden){translated.hidden=true;button.textContent='Translate to '+(languageNames[target]||target);return;}button.disabled=true;button.textContent='Translating…';try{translated.textContent=await translateText(original,target);translated.hidden=false;button.textContent='Hide translation';}catch(e){translated.textContent='Translation is temporarily unavailable. Please try again later.';translated.hidden=false;button.textContent='Retry translation';}finally{button.disabled=false;}});container.append(button,translated);}
if(!id){$('status').textContent='No member was selected. Open Discover and choose a member.';}
else{
 const {data:profile,error}=await supabase.from('profiles').select('id,username,display_name,bio,created_at').eq('id',id).maybeSingle();
 if(error){$('status').textContent='Could not load this profile: '+error.message;}
 else if(!profile){$('status').textContent='This member profile could not be found.';}
 else{
  document.title=(profile.display_name||profile.username||'Member')+' — VARTA';
  const box=$('profile'),head=document.createElement('div');head.className='member-head';
  const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(profile.display_name||profile.username||'V').trim().charAt(0).toUpperCase();
  const details=document.createElement('div');const name=document.createElement('h1');name.textContent=profile.display_name||profile.username||'VARTA Member';
  const handle=document.createElement('p');handle.className='muted';handle.textContent=profile.username?'@'+profile.username:'VARTA member';
  details.append(name,handle);head.append(avatar,details);box.append(head);
  const bio=document.createElement('p');bio.className='bio';bio.textContent=profile.bio||'This member has not added a bio yet.';box.append(bio);
  const {data: interests, error: interestsError}=await supabase.from('member_interests').select('topic').eq('user_id',profile.id);
  if(!interestsError&&interests?.length){
   const interestSection=document.createElement('section');interestSection.style.cssText='margin-top:18px';
   const interestHeading=document.createElement('h2');interestHeading.textContent='Knowledge interests';interestSection.append(interestHeading);
   const chips=document.createElement('div');chips.style.cssText='display:flex;flex-wrap:wrap;gap:8px';
   for(const item of interests){
    const chip=document.createElement('span');chip.textContent=item.topic;chip.style.cssText='display:inline-block;background:#eef4fb;color:#174b8c;border:1px solid #d6e4f5;border-radius:999px;padding:7px 12px;font-size:.92rem;font-weight:600';chips.append(chip);
   }
   interestSection.append(chips);box.append(interestSection);
  }
  const actions=document.createElement('div');actions.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-top:18px';
  const back=document.createElement('a');back.href='posts.html';back.className='btn secondary';back.textContent='Community feed';actions.append(back);
  const {data:sessionData}=await supabase.auth.getSession();const user=sessionData.session?.user;
  if(user&&user.id!==profile.id){
   const reportBtn=document.createElement('button');reportBtn.className='btn secondary';reportBtn.type='button';reportBtn.textContent='Report member';
   reportBtn.addEventListener('click',async()=>{
    const choices=['Spam','Harassment or hate','Threats or violence','Misinformation','Sexual content','Privacy violation','Other'];
    const choice=window.prompt('Report reason:\n'+choices.map((x,i)=>(i+1)+'. '+x).join('\n')+'\n\nEnter a number from 1 to 7.');
    if(choice===null)return;
    const index=Number(choice);
    if(!Number.isInteger(index)||index<1||index>choices.length){$('status').textContent='Report cancelled: choose a number from 1 to 7.';return;}
    const detailsText=window.prompt('Optional details (up to 1000 characters). Leave blank if none:')||'';
    reportBtn.disabled=true;
    const {error:reportError}=await supabase.from('content_reports').insert({reporter_id:user.id,target_type:'member',target_id:profile.id,reason:choices[index-1],details:detailsText.trim().slice(0,1000)||null});
    reportBtn.disabled=false;
    $('status').textContent=reportError?'Could not submit report: '+reportError.message:'Thank you. Your report has been submitted for review.';
   });
   actions.append(reportBtn);
   const {data:rel}=await supabase.from('follows').select('follower_id').eq('follower_id',user.id).eq('following_id',profile.id).maybeSingle();
   const btn=document.createElement('button');btn.className='btn';btn.type='button';btn.textContent=rel?'Following · Unfollow':'＋ Follow';
   btn.addEventListener('click',async()=>{btn.disabled=true;const result=rel?await supabase.from('follows').delete().eq('follower_id',user.id).eq('following_id',profile.id):await supabase.from('follows').insert({follower_id:user.id,following_id:profile.id});btn.disabled=false;if(result.error){$('status').textContent='Could not update follow: '+result.error.message;return;}location.reload();});actions.append(btn);
  }
  box.append(actions);box.hidden=false;
  const {data:memberSession}=await supabase.auth.getSession();const currentUserId=memberSession.session?.user?.id;const {data:sessionProfile}=currentUserId?await supabase.from('profiles').select('preferred_language').eq('id',currentUserId).maybeSingle():{data:null};const targetLanguage=sessionProfile?.preferred_language||'en';
  const {data:posts,error:postError}=await supabase.from('posts').select('id,content,created_at,language_code').eq('user_id',profile.id).order('created_at',{ascending:false}).limit(50);
  if(postError){$('status').textContent='Profile loaded, but posts could not be loaded: '+postError.message;}
  else{
   $('status').textContent='Member profile loaded.';$('postsHeading').hidden=false;
   if(!posts?.length){const p=document.createElement('p');p.className='muted';p.textContent='This member has not published any posts yet.';$('posts').append(p);}
   for(const post of posts||[]){const card=document.createElement('article');card.className='post';const meta=document.createElement('p');meta.className='muted';meta.textContent=new Date(post.created_at).toLocaleString();const body=document.createElement('p');body.className='postbody';body.textContent=post.content;const tools=document.createElement('div');tools.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px';addTranslationControl(tools,post.content,targetLanguage);const lang=document.createElement('span');lang.className='muted';lang.textContent='Original language: '+(post.language_code==='auto'?'auto-detected':languageNames[post.language_code]||post.language_code||'not specified');tools.append(lang);card.append(meta,body,tools);$('posts').append(card);}
  }
 }
}
</script></body></html>
