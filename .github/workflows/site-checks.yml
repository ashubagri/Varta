name: VARTA site checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: varta-site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-static-site:
    name: Validate HTML and local links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check HTML files and local links
        run: python tools/check_site.py
