<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VARTA Posts</title>
<link rel="stylesheet" href="css/style.css">
<style>
.page-wrap{max-width:900px;margin:auto;padding:36px 15px}.feed-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:18px 0}.composer textarea{width:100%;min-height:110px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;box-sizing:border-box}.btn{background:#174b8c;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.meta{color:#64748b;font-size:.9rem;margin:8px 0 14px}.postbody{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.post-actions{display:flex;align-items:center;gap:10px;margin-top:16px}.like-btn{background:#f1f5f9;color:#174b8c;border:1px solid #cbd5e1;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}.like-btn.liked{background:#fee2e2;color:#b91c1c;border-color:#fecaca}.like-btn:disabled,.follow-btn:disabled{opacity:.6;cursor:wait}.follow-btn{background:#fff;color:#174b8c;border:1px solid #174b8c;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}.follow-btn.following{background:#174b8c;color:#fff}.reply-box{margin-top:16px;padding-top:14px;border-top:1px solid #e5e7eb}.reply-list{margin-top:10px}.reply-item{background:#f8fafc;border-radius:10px;padding:10px 12px;margin:8px 0}.reply-item p{margin:4px 0}.reply-form{display:flex;gap:8px;margin-top:10px}.reply-form input{flex:1;min-width:0;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.reply-count{font-size:.9rem;color:#64748b}.muted{color:#64748b}#status{overflow-wrap:anywhere}.main-nav{flex-wrap:wrap}@media(max-width:650px){.header-wrap{align-items:flex-start;flex-direction:column;padding:14px 0}}
</style>
</head>
<body>
<header class="site-header"><div class="container header-wrap"><a href="index.html" class="brand">VARTA</a><nav class="main-nav"><a href="index.html">Home</a><a href="science.html">Science</a><a href="indian-knowledge.html">Indian Knowledge</a><a href="sound-nada.html">Sound &amp; NADA</a><a href="culture-nature.html">Culture</a><a href="world-affairs.html">World Affairs</a><a href="posts.html">Posts</a><a href="profile.html">My Profile</a></nav></div></header>
<main class="page-wrap">
<span class="eyebrow">Community</span><h1>VARTA Posts</h1><p class="tagline">Share knowledge. Start a thoughtful conversation.</p>
<p id="authstatus" class="muted">Checking sign-in…</p>
<section id="composer" class="feed-card composer" hidden><h2>Write a post</h2><p class="muted">Maximum 500 characters.</p><form id="form"><textarea id="content" maxlength="500" required placeholder="What would you like to share?"></textarea><p class="muted"><span id="count">0</span>/500 <button id="publish" class="btn" type="submit">Publish post</button></p></form></section>
<p id="status" class="muted" role="status" aria-live="polite">Loading posts…</p><section id="feed"></section>
</main>
<footer class="site-footer"><div class="container"><p>© 2026 VARTA Prototype</p></div></footer>
<script type="module">
import {supabase} from './js/supabase-client.js';
const $=id=>document.getElementById(id);
let user=null;
$('content').addEventListener('input',()=>$('count').textContent=$('content').value.length);
async function ensureOwnProfile(){
  if(!user)return;
  const {data:existing,error:readError}=await supabase.from('profiles').select('id').eq('id',user.id).maybeSingle();
  if(readError){console.warn('Could not check member profile:',readError.message);return;}
  if(existing)return;
  const emailName=(user.email||'varta-member').split('@')[0];
  const base=emailName.toLowerCase().replace(/[^a-z0-9_]/g,'_').replace(/^_+|_+$/g,'').slice(0,20)||'varta_member';
  const suffix=user.id.replace(/-/g,'').slice(0,6).toLowerCase();
  const username=(base.length<3?'member_'+base:base)+'_'+suffix;
  const displayName=emailName.replace(/[._-]+/g,' ').trim().replace(/\\b\\w/g,ch=>ch.toUpperCase()).slice(0,60)||'VARTA Member';
  const {error}=await supabase.from('profiles').insert({id:user.id,username,display_name:displayName,bio:''});
  if(error)console.warn('Could not create member profile:',error.message);
}
async function refreshAuth(){
  const {data,error}=await supabase.auth.getSession();
  if(error){$('authstatus').textContent='Sign-in status error: '+error.message;return;}
  user=data.session?.user||null;
  if(user){await ensureOwnProfile();$('authstatus').textContent='Signed in — you can publish.';$('composer').hidden=false;}
  else{$('authstatus').textContent='Sign in to publish posts.';$('composer').hidden=true;const link=document.createElement('a');link.href='login.html';link.textContent='Open VARTA Login';$('authstatus').append(' ',link);}
}
async function loadPosts(){
  const status=$('status'),feed=$('feed');status.textContent='Loading posts…';feed.replaceChildren();
  const {data:posts,error}=await supabase.from('posts').select('id,user_id,content,created_at').order('created_at',{ascending:false}).limit(50);
  if(error){status.textContent='Could not load posts: '+error.message;return;}
  if(!posts?.length){status.textContent='No community posts yet. Be the first to share something.';return;}
  const postIds=posts.map(p=>p.id);
  const {data:repliesData,error:repliesError}=await supabase.from('replies').select('id,post_id,user_id,content,created_at').in('post_id',postIds).order('created_at',{ascending:true});
  const replies=repliesError?[]:(repliesData||[]);
  const ids=[...new Set([...posts.map(p=>p.user_id),...replies.map(r=>r.user_id)].filter(Boolean))];let profiles=[],likes=[],follows=[];
  if(ids.length){const r=await supabase.from('profiles').select('id,username,display_name').in('id',ids);if(!r.error)profiles=r.data||[];}
  const lr=await supabase.from('likes').select('post_id,user_id').in('post_id',postIds);
  if(!lr.error)likes=lr.data||[];
  if(ids.length){const fr=await supabase.from('follows').select('follower_id,following_id').in('following_id',ids);if(!fr.error)follows=fr.data||[];}
  const map=new Map(profiles.map(p=>[p.id,p]));
  const likeMap=new Map();
  for(const like of likes){if(!likeMap.has(like.post_id))likeMap.set(like.post_id,[]);likeMap.get(like.post_id).push(like.user_id);}
  const repliesByPost=new Map();for(const reply of replies){if(!repliesByPost.has(reply.post_id))repliesByPost.set(reply.post_id,[]);repliesByPost.get(reply.post_id).push(reply);}
  const followerMap=new Map();const followingSet=new Set();
  for(const rel of follows){if(!followerMap.has(rel.following_id))followerMap.set(rel.following_id,new Set());followerMap.get(rel.following_id).add(rel.follower_id);if(user&&rel.follower_id===user.id)followingSet.add(rel.following_id);}
  for(const p of posts){
    const prof=map.get(p.user_id),card=document.createElement('article');card.className='feed-card';
    const h=document.createElement('h2');h.textContent=prof?.display_name||prof?.username||'VARTA Member';
    const meta=document.createElement('p');meta.className='meta';meta.textContent=(prof?.username?'@'+prof.username+' · ':'')+new Date(p.created_at).toLocaleString();
    const body=document.createElement('p');body.className='postbody';body.textContent=p.content;
    const actions=document.createElement('div');actions.className='post-actions';
    const postLikes=likeMap.get(p.id)||[];
    const button=document.createElement('button');button.type='button';button.className='like-btn'+(user&&postLikes.includes(user.id)?' liked':'');button.setAttribute('aria-pressed',String(!!user&&postLikes.includes(user.id)));
    button.textContent=(user&&postLikes.includes(user.id)?'♥ Liked':'♡ Like')+' · '+postLikes.length;
    if(!user){button.title='Sign in to like posts';}
    button.addEventListener('click',async()=>{
      if(!user){$('status').textContent='Please sign in to like posts.';return;}
      button.disabled=true;
      const alreadyLiked=postLikes.includes(user.id);
      let result;
      if(alreadyLiked) result=await supabase.from('likes').delete().eq('post_id',p.id).eq('user_id',user.id);
      else result=await supabase.from('likes').insert({post_id:p.id,user_id:user.id});
      button.disabled=false;
      if(result.error){$('status').textContent='Could not update like: '+result.error.message;return;}
      await loadPosts();
    });
    actions.append(button);
    if(user&&p.user_id&&p.user_id!==user.id){
      const isFollowing=followingSet.has(p.user_id);
      const followButton=document.createElement('button');followButton.type='button';followButton.className='follow-btn'+(isFollowing?' following':'');
      followButton.textContent=(isFollowing?'Following':'Follow')+' · '+(followerMap.get(p.user_id)?.size||0);
      followButton.setAttribute('aria-pressed',String(isFollowing));
      followButton.addEventListener('click',async()=>{
        followButton.disabled=true;
        let result;
        if(followingSet.has(p.user_id)) result=await supabase.from('follows').delete().eq('follower_id',user.id).eq('following_id',p.user_id);
        else result=await supabase.from('follows').insert({follower_id:user.id,following_id:p.user_id});
        followButton.disabled=false;
        if(result.error){$('status').textContent='Could not update follow: '+result.error.message;return;}
        await loadPosts();
      });
      actions.append(followButton);
    }
    card.append(h,meta,body,actions);
    const replyBox=document.createElement('section');replyBox.className='reply-box';
    const replyHeading=document.createElement('p');replyHeading.className='reply-count';replyHeading.textContent='Replies · '+(repliesByPost.get(p.id)||[]).length;replyBox.append(replyHeading);
    const replyList=document.createElement('div');replyList.className='reply-list';
    for(const reply of (repliesByPost.get(p.id)||[])){
      const rp=document.createElement('div');rp.className='reply-item';
      const rpName=document.createElement('strong');const rprof=map.get(reply.user_id);rpName.textContent=rprof?.display_name||rprof?.username||'VARTA Member';
      const rpMeta=document.createElement('span');rpMeta.className='muted';rpMeta.textContent=' · '+new Date(reply.created_at).toLocaleString();
      const rpBody=document.createElement('p');rpBody.textContent=reply.content;
      rp.append(rpName,rpMeta,rpBody);
      if(user&&reply.user_id===user.id){const del=document.createElement('button');del.type='button';del.className='follow-btn';del.textContent='Delete reply';del.addEventListener('click',async()=>{del.disabled=true;const result=await supabase.from('replies').delete().eq('id',reply.id).eq('user_id',user.id);if(result.error){del.disabled=false;$('status').textContent='Could not delete reply: '+result.error.message;return;}await loadPosts();});rp.append(del);}
      replyList.append(rp);
    }
    replyBox.append(replyList);
    if(user){
      const form=document.createElement('form');form.className='reply-form';
      const input=document.createElement('input');input.type='text';input.maxLength=500;input.required=true;input.placeholder='Write a reply…';
      const send=document.createElement('button');send.type='submit';send.className='btn';send.textContent='Reply';
      form.append(input,send);form.addEventListener('submit',async ev=>{ev.preventDefault();const content=input.value.trim();if(!content)return;send.disabled=true;send.textContent='Sending…';const result=await supabase.from('replies').insert({post_id:p.id,user_id:user.id,content});if(result.error){send.disabled=false;send.textContent='Reply';$('status').textContent='Could not add reply: '+result.error.message;return;}await loadPosts();});
      replyBox.append(form);
    }else{const login=document.createElement('a');login.href='login.html';login.textContent='Sign in to reply';replyBox.append(login);}
    card.append(replyBox);feed.append(card);
  }
  status.textContent=posts.length+' recent post(s)';
}
$('form').addEventListener('submit',async e=>{
  e.preventDefault();const content=$('content').value.trim();
  if(!user){$('status').textContent='Please sign in first.';return;}
  if(!content)return;
  $('publish').disabled=true;$('publish').textContent='Publishing…';
  const {error}=await supabase.from('posts').insert({user_id:user.id,content});
  $('publish').disabled=false;$('publish').textContent='Publish post';
  if(error){$('status').textContent='Could not publish: '+error.message;return;}
  $('content').value='';$('count').textContent='0';await loadPosts();
});
await refreshAuth();await loadPosts();
supabase.auth.onAuthStateChange(()=>{refreshAuth();});
</script>
</body>
</html>
