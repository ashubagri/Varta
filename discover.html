  .site-header .main-nav { display: flex !important; flex-wrap: nowrap !important; justify-content: flex-start !important; gap: 14px !important; width: 100% !important; max-width: 100% !important; overflow-x: auto !important; overflow-y: hidden !important; padding: 4px 2px 9px !important; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }

    new google.translate.TranslateElement({pageLanguage:'en', includedLanguages:'af,sq,am,ar,hy,az,eu,be,bn,bs,bg,my,ca,zh-CN,zh-TW,hr,cs,da,nl,en,eo,et,tl,fi,fr,gl,ka,de,el,gu,ht,ha,he,hi,hu,is,id,ga,it,ja,jv,kn,kk,km,ko,lo,la,lv,lt,mk,mg,ms,ml,mt,mr,mn,ne,no,ny,ps,fa,pl,pt,pa,ro,ru,sm,gd,sr,st,si,sk,sl,so,es,su,sw,sv,ta,te,th,tr,uk,ur,uz,vi,cy,xh,yi,yo,zu', layout:google.translate.TranslateElement.InlineLayout.SIMPLE, autoDisplay:false}, 'google_translate_element');
  }

<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
<style>
#varta-language-panel .goog-te-gadget{font:14px Arial,sans-serif!important;color:#0f172a!important}
#varta-language-panel .goog-te-gadget-simple{border:1px solid #cbd5e1!important;border-radius:8px!important;padding:7px!important;background:#fff!important}

<header class="site-header"><div class="container header-wrap"><a href="index.html" class="brand">VARTA</a><nav class="main-nav"><a href="index.html">Home</a><a href="posts.html">Posts</a><a href="contribute.html">Contribute</a><a href="search.html">Search</a><a href="discover.html">Discover</a><a href="activity.html">Activity</a><a href="notifications.html">Notifications</a><a href="profile.html">My Profile</a></nav></div></header>
<main class="page-wrap"><span class="eyebrow">Community</span><h1>Discover VARTA Members</h1><p class="tagline">Find people, explore their interests, and follow members whose posts you want to see.</p>
<p id="auth" class="muted">Checking sign-in…</p><section class="panel"><label for="search"><strong>Search members</strong></label><input id="search" class="search" type="search" placeholder="Search by name, username or bio…" autocomplete="off"><label for="topicFilter"><strong>Filter by knowledge interest</strong></label><select id="topicFilter" class="search" style="margin:8px 0 12px"><option value="">All knowledge interests</option><option>Science &amp; Technology</option><option>Indian Knowledge</option><option>Sound &amp; NADA</option><option>Culture &amp; Nature</option><option>World Affairs</option></select><p id="status" class="muted" role="status" aria-live="polite">Loading members…</p></section><section id="members" aria-live="polite"></section></main>
<footer class="site-footer"><div class="container"><p>© 2026 VARTA Prototype</p></div></footer>
<script type="module">
import {supabase} from './js/supabase-client.js';
const $=id=>document.getElementById(id);let user=null,profiles=[],following=new Set(),followerCounts=new Map(),interestsByUser=new Map();
const safe=(v)=>String(v||'').toLocaleLowerCase();
async function init(){
 const {data,error}=await supabase.auth.getSession();
 if(error){$('auth').textContent='Could not check sign-in: '+error.message;return;}
 user=data.session?.user||null;
 $('auth').textContent=user?'Signed in. Follow or unfollow members below.':'You can browse members without signing in; sign in to follow people.';
 if(!user){const a=document.createElement('a');a.href='login.html';a.textContent='Sign in';$('auth').append(' ',a);}
 const p=await supabase.from('profiles').select('id,username,display_name,bio,created_at').order('display_name',{ascending:true}).limit(500);
 if(p.error){$('status').textContent='Could not load members: '+p.error.message;return;}
 profiles=(p.data||[]).filter(x=>!user||x.id!==user.id);
 const f=await supabase.from('follows').select('follower_id,following_id');
 if(!f.error)for(const rel of f.data||[]){followerCounts.set(rel.following_id,(followerCounts.get(rel.following_id)||0)+1);if(user&&rel.follower_id===user.id)following.add(rel.following_id);}
 const ir=await supabase.from('member_interests').select('user_id,topic');
 if(!ir.error)for(const row of ir.data||[]){if(!interestsByUser.has(row.user_id))interestsByUser.set(row.user_id,[]);interestsByUser.get(row.user_id).push(row.topic);}
 render();
}
function render(){
 const q=safe($('search').value).trim(),topic=$('topicFilter').value,root=$('members');root.replaceChildren();
 const found=profiles.filter(p=>[p.display_name,p.username,p.bio].some(v=>safe(v).includes(q))&&(!topic||(interestsByUser.get(p.id)||[]).includes(topic)));
 $('status').textContent=found.length+' member(s)'+(q?' matching your search':' found');
 if(!found.length){const p=document.createElement('p');p.className='muted';p.textContent=q||topic?'No members match those filters yet.':'No other member profiles are available yet.';root.append(p);return;}
 for(const p of found){
  const card=document.createElement('article');card.className='member';const info=document.createElement('div');
  const name=document.createElement('h2');const profileLink=document.createElement('a');profileLink.href='member.html?id='+encodeURIComponent(p.id);profileLink.textContent=p.display_name||p.username||'VARTA Member';profileLink.style.color='inherit';profileLink.style.textDecoration='none';name.append(profileLink);
  const handle=document.createElement('p');handle.className='handle';handle.textContent=p.username?'@'+p.username:'VARTA member';
  const bio=document.createElement('p');bio.className='bio';bio.textContent=p.bio||'No bio added yet.';
  const stats=document.createElement('p');stats.className='muted';stats.textContent=(followerCounts.get(p.id)||0)+' follower(s)';
  info.append(name,handle,bio);
  const topics=interestsByUser.get(p.id)||[];
  if(topics.length){const list=document.createElement('p');list.className='muted';list.textContent='Knowledge interests: '+topics.join(' · ');info.append(list);}
  info.append(stats);card.append(info);
  if(user){const btn=document.createElement('button');btn.type='button';btn.className='btn'+(following.has(p.id)?' following':'');btn.textContent=following.has(p.id)?'Following · Unfollow':'＋ Follow';btn.setAttribute('aria-pressed',String(following.has(p.id)));
   btn.addEventListener('click',async()=>{btn.disabled=true;const wasFollowing=following.has(p.id);const result=wasFollowing?await supabase.from('follows').delete().eq('follower_id',user.id).eq('following_id',p.id):await supabase.from('follows').insert({follower_id:user.id,following_id:p.id});btn.disabled=false;if(result.error){$('status').textContent='Could not update follow: '+result.error.message;return;}if(wasFollowing){following.delete(p.id);followerCounts.set(p.id,Math.max(0,(followerCounts.get(p.id)||1)-1));}else{following.add(p.id);followerCounts.set(p.id,(followerCounts.get(p.id)||0)+1);}render();});
   card.append(btn);
  }else{const a=document.createElement('a');a.href='login.html';a.className='btn';a.textContent='Sign in to follow';card.append(a);}
  root.append(card);
 }
}
$('search').addEventListener('input',render);$('topicFilter').addEventListener('change',render);
await init();
</script></body></html>
