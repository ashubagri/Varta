<main class="page-wrap"><span class="eyebrow">Your account</span><h1>Notifications <span id="unreadbadge"></span></h1><p class="muted">See who liked, replied to, followed or reposted your content.</p><p id="status" class="muted" role="status" aria-live="polite">Checking sign-in…</p><button id="markall" class="btn" hidden>Mark all as read</button><section id="feed"></section></main><footer class="site-footer"><div class="container"><p>© 2026 VARTA Prototype</p></div></footer>
<script type="module">
import {supabase} from './js/supabase-client.js';
const $=id=>document.getElementById(id);let user=null;
const messages={like:'liked your post.',reply:'replied to your post.',follow:'started following you.',repost:'reposted your post.'};
async function load(){
 const {data:session,error:authError}=await supabase.auth.getSession();user=session?.session?.user||null;
 if(authError){$('status').textContent='Could not check sign-in: '+authError.message;return;}
 if(!user){$('status').textContent='Please sign in to view your notifications.';const a=document.createElement('a');a.href='login.html';a.textContent=' Open VARTA Login';$('status').append(a);return;}
 $('status').textContent='Loading notifications…';$('feed').replaceChildren();
 const {data,error}=await supabase.from('notifications').select('id,actor_id,kind,post_id,created_at,read_at').eq('recipient_id',user.id).order('created_at',{ascending:false}).limit(100);
 if(error){$('status').textContent='Could not load notifications: '+error.message;return;}
 const notes=data||[],unread=notes.filter(n=>!n.read_at).length;
 $('navcount').textContent=unread?'('+unread+')':'';$('unreadbadge').textContent=unread?'· '+unread+' unread':'';
 $('markall').hidden=!unread;
 if(!notes.length){$('status').textContent='No notifications yet. When members interact with your posts or follow you, you will see it here.';return;}
 const actorIds=[...new Set(notes.map(n=>n.actor_id).filter(Boolean))];let profiles=[];
 if(actorIds.length){const r=await supabase.from('profiles').select('id,username,display_name').in('id',actorIds);if(!r.error)profiles=r.data||[];}
 const map=new Map(profiles.map(p=>[p.id,p]));
 for(const n of notes){
  const card=document.createElement('article');card.className='notice'+(!n.read_at?' unread':'');
  const actor=map.get(n.actor_id),name=actor?.display_name||actor?.username||'A VARTA member';
  const p=document.createElement('p');p.textContent=name+' '+(messages[n.kind]||'interacted with you.');
  const meta=document.createElement('p');meta.className='muted';meta.textContent=new Date(n.created_at).toLocaleString();
  card.append(p,meta);
  if(n.post_id){const a=document.createElement('a');a.href='posts.html';a.textContent='Open community posts';card.append(a);}
  if(!n.read_at){const b=document.createElement('button');b.className='btn';b.textContent='Mark as read';b.style.marginLeft='10px';b.addEventListener('click',async()=>{b.disabled=true;const result=await supabase.from('notifications').update({read_at:new Date().toISOString()}).eq('id',n.id).eq('recipient_id',user.id);if(result.error){b.disabled=false;$('status').textContent='Could not mark as read: '+result.error.message;return;}await load();});card.append(b);}
  $('feed').append(card);
 }
 $('status').textContent=notes.length+' notification(s)';
}
$('markall').addEventListener('click',async()=>{if(!user)return;$('markall').disabled=true;const result=await supabase.from('notifications').update({read_at:new Date().toISOString()}).eq('recipient_id',user.id).is('read_at',null);$('markall').disabled=false;if(result.error){$('status').textContent='Could not mark notifications as read: '+result.error.message;return;}await load();});
await load();
</script></body></html>
